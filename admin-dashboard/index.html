<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>交易所 - 主页与行情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        okxGreen: '#00b07c',
                        okxRed: '#f14668',
                        okxDark: '#12181f',
                        okxCard: '#1e2631',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="bg-okxDark text-gray-200 font-sans">

    <!-- 顶栏：多语言、时区与法币/币种切换 -->
    <header class="flex justify-between items-center p-3 bg-okxCard border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-xs text-gray-400" id="live-time">00:00:00</span>
            <span id="ws-status" class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">连接中...</span>
        </div>
        <div class="flex items-center space-x-1.5">
            <select id="currency-select" onchange="changeValCurrency(this.value)" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded px-1.5 py-1 focus:outline-none">
                <option value="USDT">USDT</option>
                <option value="USD">USD ($)</option>
                <option value="CNY">CNY (¥)</option>
                <option value="HKD">HKD (HK$)</option>
                <option value="BTC">BTC (₿)</option>
            </select>
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded px-1.5 py-1 focus:outline-none">
                <option value="zh-CN">简体中文</option>
                <option value="en-US">English</option>
                <option value="zh-HK">繁體中文</option>
            </select>
        </div>
    </header>

    <!-- 主页顶部资产总览卡片 -->
    <div class="p-3">
        <div class="bg-gradient-to-r from-okxCard to-gray-800 p-4 rounded-xl border border-gray-800 shadow-lg">
            <div class="text-xs text-gray-400" data-i18n="total-equity">账户总资产折合</div>
            <div class="text-2xl font-extrabold text-white mt-1" id="home-total-val">--</div>
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button onclick="openModal('deposit')" class="bg-okxGreen text-white py-1.5 rounded text-xs font-bold shadow flex items-center justify-center space-x-1 cursor-pointer">
                    <span>↓</span> <span data-i18n="btn-deposit">充币</span>
                </button>
                <button onclick="openModal('withdraw')" class="bg-gray-700 hover:bg-gray-600 text-white py-1.5 rounded text-xs font-bold shadow flex items-center justify-center space-x-1 cursor-pointer">
                    <span>↑</span> <span data-i18n="btn-withdraw">提币</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 行情列表区域 -->
    <div class="px-3">
        <div class="text-xs text-gray-400 mb-2 flex justify-between px-1">
            <span data-i18n="th-pair">币种 / 成交额</span>
            <span data-i18n="th-price">最新价 / 24h涨跌</span>
        </div>
        <div id="coin-list" class="space-y-2"></div>
    </div>

    <!-- 全局弹窗模块（充币/提币） -->
    <div id="action-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-okxCard w-full max-w-sm rounded-xl border border-gray-700 p-4 text-xs space-y-3 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-base font-bold">&times;</button>
            <div id="modal-title" class="text-sm font-bold text-white border-b border-gray-800 pb-2"></div>
            <div id="modal-body" class="space-y-3"></div>
        </div>
    </div>

    <!-- 底部导航栏：与 assets.html 保持完全一致的精美图标 -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 bg-okxCard border-t border-gray-800 flex justify-around items-center pb-[env(safe-area-inset-bottom)] z-50">
        <a href="./market.html" class="flex-1 h-full text-okxGreen text-xs flex flex-col items-center justify-center font-bold">
            <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"></path></svg>
            <span data-i18n="nav-market">行情</span>
        </a>
        <a href="./trade.html?symbol=BTC" class="flex-1 h-full text-gray-400 text-xs flex flex-col items-center justify-center font-bold">
            <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"></path></svg>
            <span data-i18n="nav-trade">交易</span>
        </a>
        <a href="./assets.html" class="flex-1 h-full text-gray-400 text-xs flex flex-col items-center justify-center font-bold">
            <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M9 9.563C9 9.252 9.252 9 9.563 9h4.874c.311 0 .563.252.563.563v4.874c0 .311-.252.563-.563.563H9.564A.562.562 0 019 14.437V9.564z"></path></svg>
            <span data-i18n="nav-assets">资产</span>
        </a>
    </nav>

    <script>
        const i18nData = {
            'zh-CN': {
                'total-equity': '账户总资产折合', 'btn-deposit': '链上充币', 'btn-withdraw': '快捷提币',
                'th-pair': '币种 / 成交额', 'th-price': '最新价 / 24h涨跌',
                'nav-market': '行情', 'nav-trade': '交易', 'nav-assets': '资产', 'timeZone': 'Asia/Shanghai',
                'title-deposit': 'TRC20 链上充币', 'title-withdraw': '数字资产提现',
                'lbl-network': '充币网络', 'lbl-amount': '数量', 'lbl-address': '充币地址',
                'btn-copy': '复制地址', 'copy-success': '充币地址已复制！',
                'btn-confirm-dep': '模拟链上到账 (+$10,000)', 'btn-confirm-wit': '确认提币',
                'alert-dep': '🎉 充值成功！USDT 已实时入账。', 'alert-wit': '✅ 提币申请已提交！'
            },
            'en-US': {
                'total-equity': 'Total Account Equity', 'btn-deposit': 'Deposit', 'btn-withdraw': 'Withdraw',
                'th-pair': 'Pair / Vol', 'th-price': 'Last Price / 24h Chg',
                'nav-market': 'Market', 'nav-trade': 'Trade', 'nav-assets': 'Assets', 'timeZone': 'America/New_York',
                'title-deposit': 'On-chain Deposit', 'title-withdraw': 'Withdrawal',
                'lbl-network': 'Network', 'lbl-amount': 'Amount', 'lbl-address': 'Address',
                'btn-copy': 'Copy', 'copy-success': 'Address copied!',
                'btn-confirm-dep': 'Simulate Deposit (+$10,000)', 'btn-confirm-wit': 'Confirm Withdraw',
                'alert-dep': '🎉 Deposit successful!', 'alert-wit': '✅ Withdrawal submitted!'
            },
            'zh-HK': {
                'total-equity': '賬戶總資產折合', 'btn-deposit': '鏈上充幣', 'btn-withdraw': '快捷提幣',
                'th-pair': '幣種 / 成交額', 'th-price': '最新價 / 24h漲跌',
                'nav-market': '行情', 'nav-trade': '交易', 'nav-assets': '資產', 'timeZone': 'Asia/Hong_Kong',
                'title-deposit': 'TRC20 鏈上充幣', 'title-withdraw': '數字資產提現',
                'lbl-network': '充幣網絡', 'lbl-amount': '數量', 'lbl-address': '充幣地址',
                'btn-copy': '複製地址', 'copy-success': '充幣地址已複製！',
                'btn-confirm-dep': '模擬鏈上到賬 (+$10,000)', 'btn-confirm-wit': '確認提幣',
                'alert-dep': '🎉 充值成功！USDT 已實時入賬。', 'alert-wit': '✅ 提幣申請已提交！'
            }
        };

        const topCoins = [
            { symbol: 'BTC', name: 'Bitcoin', price: 83350.00, change: 2.45, vol: '3.82B', iconUrl: 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png' },
            { symbol: 'ETH', name: 'Ethereum', price: 3120.50, change: -0.82, vol: '1.95B', iconUrl: 'https://assets.coingecko.com/coins/images/279/large/ethereum.png' },
            { symbol: 'SOL', name: 'Solana', price: 185.20, change: 5.12, vol: '1.20B', iconUrl: 'https://assets.coingecko.com/coins/images/4128/large/solana.png' },
            { symbol: 'XRP', name: 'XRP', price: 0.6250, change: 1.15, vol: '850M', iconUrl: 'https://assets.coingecko.com/coins/images/44/large/xrp-symbol-white-128.png' },
            { symbol: 'DOGE', name: 'Dogecoin', price: 0.1680, change: -2.34, vol: '720M', iconUrl: 'https://assets.coingecko.com/coins/images/5/large/dogecoin.png' },
            { symbol: 'ADA', name: 'Cardano', price: 0.4520, change: 0.45, vol: '410M', iconUrl: 'https://assets.coingecko.com/coins/images/975/large/cardano.png' },
            { symbol: 'TRX', name: 'TRON', price: 0.1240, change: 0.88, vol: '350M', iconUrl: 'https://assets.coingecko.com/coins/images/1094/large/tron-logo.png' },
            { symbol: 'AVAX', name: 'Avalanche', price: 32.50, change: 3.40, vol: '310M', iconUrl: 'https://assets.coingecko.com/coins/images/12559/large/Avalanche_Circle_RedWhite_Trans.png' },
            { symbol: 'LINK', name: 'Chainlink', price: 14.80, change: -1.20, vol: '290M', iconUrl: 'https://assets.coingecko.com/coins/images/877/large/chainlink-new-logo.png' },
            { symbol: 'SUI', name: 'Sui', price: 1.95, change: 8.45, vol: '580M', iconUrl: 'https://assets.coingecko.com/coins/images/26375/large/sui-ocean-square.png' },
            { symbol: 'SHIB', name: 'Shiba Inu', price: 0.000022, change: -1.50, vol: '260M', iconUrl: 'https://assets.coingecko.com/coins/images/11939/large/shiba.png' },
            { symbol: 'BCH', name: 'Bitcoin Cash', price: 380.00, change: 1.05, vol: '210M', iconUrl: 'https://assets.coingecko.com/coins/images/780/large/bitcoin-cash-circle.png' },
            { symbol: 'DOT', name: 'Polkadot', price: 7.20, change: -0.65, vol: '190M', iconUrl: 'https://assets.coingecko.com/coins/images/12171/large/polkadot.png' },
            { symbol: 'NEAR', name: 'NEAR Protocol', price: 5.60, change: 4.10, vol: '240M', iconUrl: 'https://assets.coingecko.com/coins/images/10365/large/near.png' },
            { symbol: 'LTC', name: 'Litecoin', price: 82.40, change: 0.20, vol: '180M', iconUrl: 'https://assets.coingecko.com/coins/images/2/large/litecoin.png' },
            { symbol: 'UNI', name: 'Uniswap', price: 8.90, change: 2.15, vol: '160M', iconUrl: 'https://assets.coingecko.com/coins/images/12504/large/uniswap-uni.png' },
            { symbol: 'APT', name: 'Aptos', price: 9.50, change: -3.20, vol: '220M', iconUrl: 'https://assets.coingecko.com/coins/images/26455/large/aptos_round.png' },
            { symbol: 'PEPE', name: 'Pepe', price: 0.000012, change: 6.80, vol: '450M', iconUrl: 'https://assets.coingecko.com/coins/images/29850/large/pepe-token.png' },
            { symbol: 'ICP', name: 'Internet Computer', price: 9.20, change: -0.90, vol: '130M', iconUrl: 'https://assets.coingecko.com/coins/images/14470/large/Internet_Computer_logo.png' },
            { symbol: 'RENDER', name: 'Render Token', price: 7.80, change: 3.85, vol: '170M', iconUrl: 'https://assets.coingecko.com/coins/images/11636/large/rndr.png' }
        ];

        let currentLang = localStorage.getItem('exchange_lang') || 'zh-CN';
        let currentCurrency = localStorage.getItem('exchange_currency') || 'USDT';
        document.getElementById('lang-select').value = currentLang;
        document.getElementById('currency-select').value = currentCurrency;

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('exchange_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[currentLang][key]) el.innerText = i18nData[currentLang][key];
            });
        }
        changeLanguage(currentLang);

        function changeValCurrency(curr) {
            currentCurrency = curr;
            localStorage.setItem('exchange_currency', curr);
            updateHomeTotalVal();
        }

        function updateLocalizedTime() {
            const timeZone = i18nData[currentLang].timeZone || 'Asia/Shanghai';
            const timeStr = new Intl.DateTimeFormat('en-GB', { timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
            document.getElementById('live-time').innerText = `${timeStr} (${currentLang.split('-')[1]})`;
        }
        setInterval(updateLocalizedTime, 1000);
        updateLocalizedTime();

        let btcLivePrice = 83350.0;
        const symbols = { USDT: 'USDT', USD: '$', CNY: '¥', HKD: 'HK$', BTC: '₿' };

        function getRate(curr) {
            if (curr === 'USDT' || curr === 'USD') return 1.0;
            if (curr === 'CNY') return 7.25;
            if (curr === 'HKD') return 7.82;
            if (curr === 'BTC') return 1 / (btcLivePrice || 83350.0);
            return 1.0;
        }

        function updateHomeTotalVal() {
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            let totalUSDT = assets.usdt || 0;
            let converted = totalUSDT * getRate(currentCurrency);
            let symbolStr = symbols[currentCurrency] || 'USDT';

            let valStr = currentCurrency === 'BTC' ? converted.toFixed(4) : converted.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('home-total-val').innerHTML = `${valStr} <span class="text-sm font-normal text-gray-400">${symbolStr}</span>`;
        }

        function renderCoinList() {
            const container = document.getElementById('coin-list');
            container.innerHTML = '';
            topCoins.forEach((coin, index) => {
                const isPos = coin.change >= 0;
                container.innerHTML += `
                    <a href="./trade.html?symbol=${coin.symbol}" id="coin-row-${index}" class="bg-okxCard p-3 rounded-lg border border-gray-800 flex justify-between items-center block hover:border-gray-600 transition">
                        <div class="flex items-center space-x-2.5">
                            <img src="${coin.iconUrl}" alt="${coin.symbol}" class="w-7 h-7 rounded-full object-cover bg-gray-800 p-0.5" onerror="this.onerror=null;this.src='https://assets.coingecko.com/coins/images/325/large/Tether.png';">
                            <div>
                                <div class="font-bold text-white text-sm">${coin.symbol} <span class="text-gray-400 text-xs font-normal">/ USDT</span></div>
                                <div class="text-[10px] text-gray-400 font-medium">${coin.name} <span class="text-gray-500 ml-1">Vol ${coin.vol}</span></div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-sm text-white" id="price-${index}">${coin.price < 1 ? coin.price.toFixed(6) : coin.price.toFixed(2)}</div>
                            <div class="text-xs ${isPos ? 'text-okxGreen' : 'text-okxRed'} font-medium mt-0.5" id="change-${index}">${isPos ? '+' : ''}${coin.change.toFixed(2)}%</div>
                        </div>
                    </a>
                `;
            });
        }
        renderCoinList();

        function updateCoinDisplay(index, newPrice, newChange = null) {
            const priceEl = document.getElementById(`price-${index}`);
            const changeEl = document.getElementById(`change-${index}`);
            if (!priceEl) return;

            topCoins[index].price = newPrice;
            if (newChange !== null) topCoins[index].change = newChange;

            if (topCoins[index].symbol === 'BTC') {
                btcLivePrice = newPrice;
            }

            priceEl.innerText = newPrice < 1 ? newPrice.toFixed(6) : newPrice.toFixed(2);

            if (newChange !== null) {
                const isPos = newChange >= 0;
                changeEl.innerText = `${isPos ? '+' : ''}${newChange.toFixed(2)}%`;
                changeEl.className = `text-xs ${isPos ? 'text-okxGreen' : 'text-okxRed'} font-medium mt-0.5`;
            }
        }

        let ws;
        function initBinanceWebSocket() {
            const streams = topCoins.map(c => `${c.symbol.toLowerCase()}usdt@ticker`).join('/');
            const wsUrl = `wss://stream.binance.com:9443/ws/${streams}`;
            const wsStatusEl = document.getElementById('ws-status');

            try {
                ws = new WebSocket(wsUrl);
                ws.onopen = () => {
                    wsStatusEl.innerText = '🔴 Binance';
                    wsStatusEl.className = 'text-[10px] px-1.5 py-0.5 rounded bg-okxGreen/20 text-okxGreen border border-okxGreen/30';
                };
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data && data.s) {
                        const symbolStr = data.s.replace('USDT', '');
                        const coinIndex = topCoins.findIndex(c => c.symbol === symbolStr);
                        if (coinIndex !== -1) {
                            const newPrice = parseFloat(data.c);
                            const newChange = parseFloat(data.P);
                            updateCoinDisplay(coinIndex, newPrice, newChange);
                        }
                    }
                };
                ws.onerror = () => { fallbackToSimulated(); };
                ws.onclose = () => { fallbackToSimulated(); };
            } catch (e) {
                fallbackToSimulated();
            }
        }

        let isSimulating = false;
        function fallbackToSimulated() {
            if (isSimulating) return;
            isSimulating = true;
            const wsStatusEl = document.getElementById('ws-status');
            wsStatusEl.innerText = '⚡ 模拟模式';
            wsStatusEl.className = 'text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30';

            setInterval(() => {
                const count = Math.floor(Math.random() * 4) + 3;
                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * topCoins.length);
                    const coin = topCoins[randomIndex];
                    const deltaPercent = (Math.random() - 0.49) * 0.006;
                    const newPrice = coin.price * (1 + deltaPercent);
                    const newChange = coin.change + deltaPercent * 10;
                    updateCoinDisplay(randomIndex, newPrice, newChange);
                }
            }, 1200);
        }

        function openModal(type) {
            const modal = document.getElementById('action-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const dict = i18nData[currentLang];
            modal.classList.remove('hidden');

            if (type === 'deposit') {
                titleEl.innerText = dict['title-deposit'];
                const trc20Addr = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${trc20Addr}`;
                bodyEl.innerHTML = `
                    <div><label class="text-gray-400 block mb-1">${dict['lbl-network']}</label>
                    <div class="bg-gray-900 border border-okxGreen text-okxGreen font-bold rounded p-1.5 text-center">TRON (TRC20)</div></div>
                    <div class="flex flex-col items-center justify-center py-2 bg-gray-900/50 rounded border border-gray-800">
                        <img src="${qrUrl}" class="w-28 h-28 bg-white p-1 rounded mb-2">
                        <span class="text-[10px] text-gray-400 text-center px-2 break-all" id="dep-addr">${trc20Addr}</span>
                    </div>
                    <button onclick="copyAddr()" class="w-full bg-gray-700 text-white py-1.5 rounded font-bold">${dict['btn-copy']}</button>
                    <button onclick="confirmDep()" class="w-full bg-okxGreen text-white py-2 rounded font-bold mt-1">${dict['btn-confirm-dep']}</button>
                `;
            } else if (type === 'withdraw') {
                titleEl.innerText = dict['title-withdraw'];
                bodyEl.innerHTML = `
                    <div><label class="text-gray-400 block mb-1">${dict['lbl-address']}</label>
                    <input type="text" placeholder="T..." class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white"></div>
                    <div><label class="text-gray-400 block mb-1">${dict['lbl-amount']} (USDT)</label>
                    <input type="text" id="wit-amt" placeholder="1000" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white"></div>
                    <button onclick="confirmWit()" class="w-full bg-red-600 text-white py-2 rounded font-bold mt-2">${dict['btn-confirm-wit']}</button>
                `;
            }
        }
        function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }
        function copyAddr() {
            navigator.clipboard.writeText(document.getElementById('dep-addr').innerText).then(() => alert(i18nData[currentLang]['copy-success']));
        }
        function confirmDep() {
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            assets.usdt += 10000.00;
            localStorage.setItem('user_assets', JSON.stringify(assets));
            logHistory('充币 (Deposit)', '+10,000 USDT');
            updateHomeTotalVal();
            closeModal();
            alert(i18nData[currentLang]['alert-dep']);
        }
        function confirmWit() {
            let amt = parseFloat(document.getElementById('wit-amt').value);
            if (isNaN(amt) || amt <= 0) { alert('请输入有效金额！'); return; }
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            if (assets.usdt < amt) { alert('可用余额不足！'); return; }
            assets.usdt -= amt;
            localStorage.setItem('user_assets', JSON.stringify(assets));
            logHistory('提币 (Withdraw)', `-${amt} USDT`);
            updateHomeTotalVal();
            closeModal();
            alert(i18nData[currentLang]['alert-wit']);
        }
        function logHistory(action, detail) {
            let logs = JSON.parse(localStorage.getItem('user_history_logs')) || [];
            logs.unshift({ action, detail, time: new Date().toLocaleString() });
            localStorage.setItem('user_history_logs', JSON.stringify(logs));
        }

        window.onload = function() {
            updateHomeTotalVal();
            initBinanceWebSocket();
        };
        setInterval(updateHomeTotalVal, 1000);
    </script>
