            { symbol: 'ICP', name: 'Internet Computer', price: 9.20, change: -0.90, vol: '130M', iconUrl: 'https://assets.coingecko.com/coins/images/14495/large/Internet_Computer_logo.png' },
            { symbol: 'RENDER', name: 'Render Token', price: 7.80, change: 3.85, vol: '170M', iconUrl: 'https://assets.coingecko.com/coins/images/11636/large/rndr.png' }
        ];

        let currentLang = localStorage.getItem('exchange_lang') || 'zh-CN';
        let currentCurrency = localStorage.getItem('exchange_currency') || 'USDT';
        let currentTab = 'all';
        let searchQuery = '';

        document.getElementById('lang-select').value = currentLang;
        document.getElementById('currency-select').value = currentCurrency;

        function getCurrentUser() {
            return localStorage.getItem('exchange_current_user') || null;
        }

        function updateLoginButtonDisplay() {
            const user = getCurrentUser();
            const btn = document.getElementById('user-btn');
            const dict = i18nData[currentLang];
            if (btn) {
                if (user) {
                    btn.innerText = user;
                    btn.className = "text-[10px] bg-idexCyan/20 text-idexCyan border border-idexCyan/40 px-2.5 py-1 rounded-lg font-bold truncate max-w-[110px]";
                } else {
                    btn.innerText = dict['btn-not-login'] || '连接钱包';
                    btn.className = "text-[10px] bg-idexCyan/15 text-idexCyan border border-idexCyan/30 px-2.5 py-1 rounded-lg font-bold truncate max-w-[110px]";
                }
            }
        }

        function openUserCenter() {
            const user = getCurrentUser();
            if (!user) {
                renderLoginView();
            } else {
                renderUserProfileView(user);
            }
            document.getElementById('user-modal').classList.remove('hidden');
        }
        function closeUserModal() {
            document.getElementById('user-modal').classList.add('hidden');
        }

        function renderLoginView() {
            const dict = i18nData[currentLang];
            document.getElementById('user-modal-title').innerText = dict['login-title'];
            document.getElementById('user-modal-body').innerHTML = `
                <div><label class="text-gray-400 block mb-1">${dict['lbl-username']}</label>
                <input type="text" id="login-username" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white focus:border-idexCyan focus:outline-none"></div>
                <div><label class="text-gray-400 block mb-1">${dict['lbl-password']}</label>
                <input type="password" id="login-password" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white focus:border-idexCyan focus:outline-none"></div>
                <button onclick="handleLoginSubmit()" class="w-full bg-idexCyan text-black font-extrabold py-2 rounded mt-2 hover:opacity-90 transition">${dict['btn-login']}</button>
                <div class="text-center pt-2 text-gray-400">${dict['no-account']} <button onclick="renderRegisterView()" class="text-idexCyan underline font-bold">${dict['to-register']}</button></div>
            `;
        }

        function renderRegisterView() {
            const dict = i18nData[currentLang];
            document.getElementById('user-modal-title').innerText = dict['register-title'];
            document.getElementById('user-modal-body').innerHTML = `
                <div><label class="text-gray-400 block mb-1">${dict['lbl-username']} *</label>
                <input type="text" id="reg-username" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white"></div>
                <div><label class="text-gray-400 block mb-1">${dict['lbl-password']} *</label>
                <input type="password" id="reg-password" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white"></div>
                <div><label class="text-gray-400 block mb-1">${dict['lbl-birthday']} *</label>
                <input type="date" id="reg-birthday" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white"></div>
                <div><label class="text-gray-400 block mb-1">${dict['lbl-address']} *</label>
                <input type="text" id="reg-address" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white"></div>
                <div>
                    <label class="text-gray-400 block mb-1">${dict['lbl-contact']} *</label>
                    <div class="flex space-x-1.5">
                        <input type="email" id="reg-contact" placeholder="name@example.com" class="flex-1 bg-black border border-gray-800 rounded p-1.5 text-white">
                        <button onclick="sendVerificationCode()" class="bg-gray-800 hover:bg-gray-700 text-white px-2 py-1.5 rounded text-[11px] font-bold whitespace-nowrap cursor-pointer">${dict['btn-get-code']}</button>
                    </div>
                </div>
                <div>
                    <label class="text-gray-400 block mb-1">${dict['lbl-code']} *</label>
                    <input type="text" id="reg-code" placeholder="6-digit" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white">
                </div>
                <button onclick="handleRegisterSubmit()" class="w-full bg-idexCyan text-black font-extrabold py-2 rounded mt-2 hover:opacity-95 transition">${dict['btn-register']}</button>
                <div class="text-center pt-2 text-gray-400">${dict['has-account']} <button onclick="renderLoginView()" class="text-idexCyan underline font-bold">${dict['to-login']}</button></div>
            `;
        }

        async function sendVerificationCode() {
            const contactVal = document.getElementById('reg-contact').value.trim();
            if (!contactVal) { alert('请输入电子邮箱'); return; }
            try {
                let response = await fetch(`${API_BASE_URL}/api/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: contactVal })
                });
                let result = await response.json();
                if (result.success) { alert('✅ 验证码已发送！'); }
                else { alert('发送失败: ' + (result.message || '未知错误')); }
            } catch (error) { alert('后端连接异常'); }
        }

        function renderUserProfileView(username) {
            const dict = i18nData[currentLang];
            let usersDb = JSON.parse(localStorage.getItem('exchange_users_db')) || {};
            let userInfo = usersDb[username] || {};
            let kyc = userInfo.kyc || { status: dict['status-unverified'], type: '' };

            document.getElementById('user-modal-title').innerText = `${dict['user-center-title']}: ${username}`;
            document.getElementById('user-modal-body').innerHTML = `
                <div class="bg-black p-2.5 rounded border border-gray-800 space-y-1 text-gray-300">
                    <div>${dict['lbl-birthday']}: <span class="text-white">${userInfo.birthday || '-'}</span></div>
                    <div>${dict['lbl-address']}: <span class="text-white">${userInfo.address || '-'}</span></div>
                    <div>${dict['lbl-contact']}: <span class="text-white">${userInfo.contact || '-'}</span></div>
                    <div>KYC: <span class="${kyc.status===dict['status-verified']?'text-idexCyan':'text-amber-400'} font-bold">${kyc.status}</span></div>
                </div>
                ${kyc.status !== dict['status-verified'] ? `
                    <div class="border-t border-gray-800 pt-2 space-y-2">
                        <div class="font-bold text-white">${dict['kyc-title']}</div>
                        <div>
                            <label class="text-gray-400 block mb-1">${dict['kyc-type']}</label>
                            <select id="kyc-type" class="w-full bg-black border border-gray-800 rounded p-1.5 text-white">
                                <option value="身份证">${dict['doc-type-1']}</option>
                                <option value="护照">${dict['doc-type-2']}</option>
                            </select>
                        </div>
                        <button onclick="submitKyc()" class="w-full bg-idexCyan text-black font-bold py-2 rounded">${dict['btn-submit-kyc']}</button>
                    </div>
                ` : `<div class="text-idexCyan text-center font-bold py-1">${dict['kyc-verified']}</div>`}
                <button onclick="handleLogout()" class="w-full bg-red-600/80 text-white py-1.5 rounded font-bold mt-3">${dict['btn-logout']}</button>
            `;
        }

        async function handleRegisterSubmit() {
            const dict = i18nData[currentLang];
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const birthday = document.getElementById('reg-birthday').value;
            const address = document.getElementById('reg-address').value.trim();
            const contact = document.getElementById('reg-contact').value.trim();
            const inputCode = document.getElementById('reg-code').value.trim();

            if (!username || !password || !birthday || !address || !contact || !inputCode) {
                alert(dict['err-fill-all']); return;
            }
            let usersDb = JSON.parse(localStorage.getItem('exchange_users_db')) || {};
            if (usersDb[username]) { alert('用户已存在'); return; }

            try {
                let response = await fetch(`${API_BASE_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, birthday, address, contact, code: inputCode })
                });
                let result = await response.json();
                if (result.success) {
                    usersDb[username] = { password, birthday, address, contact, kyc: { status: dict['status-unverified'] } };
                    localStorage.setItem('exchange_users_db', JSON.stringify(usersDb));
                    localStorage.setItem('exchange_current_user', username);
                    alert(dict['success-reg']);
                    closeUserModal();
                    updateLoginButtonDisplay();
                } else { alert(result.message || '注册失败'); }
            } catch (error) { alert('后端连接异常'); }
        }

        function handleLoginSubmit() {
            const dict = i18nData[currentLang];
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            let usersDb = JSON.parse(localStorage.getItem('exchange_users_db')) || {};
            if (!usersDb[username] || usersDb[username].password !== password) {
                alert(dict['err-login']); return;
            }
            localStorage.setItem('exchange_current_user', username);
            alert(`${dict['welcome']}${username}`);
            closeUserModal();
            updateLoginButtonDisplay();
        }

        function handleLogout() {
            const dict = i18nData[currentLang];
            localStorage.removeItem('exchange_current_user');
            alert(dict['logout-msg']);
            closeUserModal();
            updateLoginButtonDisplay();
        }

        function submitKyc() {
            const user = getCurrentUser();
            if (!user) return;
            let usersDb = JSON.parse(localStorage.getItem('exchange_users_db')) || {};
            if (usersDb[user]) {
                usersDb[user].kyc = { status: '已认证', time: new Date().toLocaleString() };
                localStorage.setItem('exchange_users_db', JSON.stringify(usersDb));
                alert('🎉 高级认证通过！');
                renderUserProfileView(user);
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('exchange_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[currentLang] && i18nData[currentLang][key]) {
                    el.innerText = i18nData[currentLang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18nData[currentLang] && i18nData[currentLang][key]) {
                    el.placeholder = i18nData[currentLang][key];
                }
            });
            updateLoginButtonDisplay();
            renderCoinList();
        }

        function changeValCurrency(curr) {
            currentCurrency = curr;
            localStorage.setItem('exchange_currency', curr);
            renderCoinList();
        }

        function updateLocalizedTime() {
            try {
                const timeZone = (i18nData[currentLang] && i18nData[currentLang].timeZone) || 'Asia/Shanghai';
                const timeStr = new Intl.DateTimeFormat('en-GB', { timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
                document.getElementById('live-time').innerText = `${timeStr}`;
            } catch (e) {}
        }
        setInterval(updateLocalizedTime, 1000);
        updateLocalizedTime();

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'hot', 'gainers', 'losers', 'vol'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (!btn) return;
                if (t === tab) {
                    btn.className = "text-idexCyan border-b-2 border-idexCyan pb-1 whitespace-nowrap font-bold transition";
                } else {
                    btn.className = "text-gray-400 pb-1 whitespace-nowrap font-normal transition hover:text-white";
                }
            });
            renderCoinList();
        }

        function filterCoins(query) {
            searchQuery = query.toLowerCase().trim();
            renderCoinList();
        }

        function renderCoinList() {
            const container = document.getElementById('coin-list');
            if (!container) return;

            let list = [...topCoins];
            if (searchQuery) {
                list = list.filter(c => c.symbol.toLowerCase().includes(searchQuery) || c.name.toLowerCase().includes(searchQuery));
            }
            if (currentTab === 'hot') {
                list = list.filter(c => ['BTC', 'ETH', 'SOL', 'SUI'].includes(c.symbol));
            } else if (currentTab === 'gainers') {
                list.sort((a, b) => b.change - a.change);
            } else if (currentTab === 'losers') {
                list.sort((a, b) => a.change - b.change);
            } else if (currentTab === 'vol') {
                list.sort((a, b) => parseFloat(b.vol) - parseFloat(a.vol));
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center py-10 text-xs">未找到相关币种</div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach((coin) => {
                const isPos = coin.change >= 0;
                container.innerHTML += `
                    <a href="./trade.html?symbol=${coin.symbol}" class="bg-okxCard p-3 rounded-xl border-0 flex justify-between items-center block hover:bg-gray-900/40 transition">
                        <div class="flex items-center space-x-2.5">
                            <img src="${coin.iconUrl}" alt="${coin.symbol}" class="w-7 h-7 rounded-full object-cover bg-black p-0.5" onerror="this.onerror=null;this.src='https://assets.coingecko.com/coins/images/325/large/Tether.png';">
                            <div>
                                <div class="font-bold text-white text-sm">${coin.symbol} <span class="text-gray-500 text-xs font-normal">/ USDT</span></div>
                                <div class="text-[10px] text-gray-500 font-medium">${coin.name} <span class="text-gray-600 ml-1">Vol ${coin.vol}</span></div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-sm text-white font-mono">${coin.price < 1 ? coin.price.toFixed(6) : coin.price.toFixed(2)}</div>
                            <div class="text-xs ${isPos ? 'text-idexCyan' : 'text-okxRed'} font-medium mt-0.5 font-mono">${isPos ? '+' : ''}${coin.change.toFixed(2)}%</div>
                        </div>
                    </a>
                `;
            });
        }

        // WebSocket 实时行情驱动
        let ws;
        function initBinanceWebSocket() {
            const streams = topCoins.map(c => `${c.symbol.toLowerCase()}usdt@ticker`).join('/');
            const wsUrl = `wss://stream.binance.com:9443/ws/${streams}`;

            try {
                ws = new WebSocket(wsUrl);
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data && data.s) {
                        const symbolStr = data.s.replace('USDT', '');
                        const coin = topCoins.find(c => c.symbol === symbolStr);
                        if (coin) {
                            coin.price = parseFloat(data.c);
                            coin.change = parseFloat(data.P);
                            renderCoinList();
                        }
                    }
                };
                ws.onerror = () => { fallbackToSimulated(); };
                ws.onclose = () => { fallbackToSimulated(); };
            } catch (e) { fallbackToSimulated(); }
        }

        let isSimulating = false;
        function fallbackToSimulated() {
            if (isSimulating) return;
            isSimulating = true;
            setInterval(() => {
                const count = Math.floor(Math.random() * 4) + 2;
                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * topCoins.length);
                    const coin = topCoins[randomIndex];
                    const deltaPercent = (Math.random() - 0.49) * 0.005;
                    coin.price = coin.price * (1 + deltaPercent);
                    coin.change += deltaPercent * 10;
                }
                renderCoinList();
            }, 1500);
        }

        window.onload = function() {
            changeLanguage(currentLang);
            updateLoginButtonDisplay();
            initBinanceWebSocket();
        };
    </script>
</body>
</html>
