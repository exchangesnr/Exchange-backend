<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>交易所 - 专业交易大厅</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        okxGreen: '#00b07c',
                        okxRed: '#f14668',
                        okxDark: '#12181f',
                        okxCard: '#1e2631',
                    }
                }
            }
        }
    </script>
    <style>
        /* 针对 iOS 底部安全区域的通用留白补丁 */
        body {
            padding-bottom: calc(5rem + env(safe-area-inset-bottom));
        }
        /* 自定义滚动条美化 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #12181f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3441;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-okxDark text-gray-200 font-sans selection:bg-okxGreen selection:text-white">

    <!-- 顶栏：内置 Top 20 币种快捷切换下拉菜单、多货币、时区与语言切换 -->
    <header class="flex justify-between items-center p-3 bg-okxCard border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-2">
            <select id="symbol-select" onchange="switchSymbol(this.value)" class="bg-gray-900 border border-gray-700 text-white font-bold text-xs sm:text-sm rounded px-2 py-1.5 focus:outline-none focus:border-okxGreen transition">
                <!-- 动态由JS填充 Top 20 选项 -->
            </select>
            <span class="text-[10px] bg-okxGreen/20 text-okxGreen px-1.5 py-0.5 rounded font-medium" data-i18n="tag-sim">Pro</span>
        </div>
        <div class="flex items-center space-x-2">
            <select id="currency-select" onchange="changeValCurrency(this.value)" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded px-1.5 py-1.5 focus:outline-none focus:border-okxGreen transition">
                <option value="USDT">USDT</option>
                <option value="USD">USD ($)</option>
                <option value="CNY">CNY (¥)</option>
                <option value="HKD">HKD (HK$)</option>
                <option value="BTC">BTC (₿)</option>
            </select>
            <span id="live-time" class="hidden sm:inline-block text-[11px] text-gray-400 font-mono">00:00:00</span>
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded px-1.5 py-1.5 focus:outline-none focus:border-okxGreen transition">
                <option value="zh-CN">简体</option>
                <option value="en-US">En</option>
                <option value="zh-HK">繁體</option>
            </select>
        </div>
    </header>

    <!-- 交易模式切换一级导航栏 -->
    <div class="bg-okxCard px-3 py-2 border-b border-gray-800 flex space-x-6 text-xs font-bold overflow-x-auto shadow-inner">
        <button onclick="switchMode('spot')" id="mode-spot-btn" class="text-okxGreen border-b-2 border-okxGreen pb-1 whitespace-nowrap transition" data-i18n="mode-spot">现货</button>
        <button onclick="switchMode('futures')" id="mode-futures-btn" class="text-gray-400 pb-1 whitespace-nowrap transition hover:text-white" data-i18n="mode-futures">永续合约</button>
        <button onclick="switchMode('options')" id="mode-options-btn" class="text-gray-400 pb-1 whitespace-nowrap transition hover:text-white" data-i18n="mode-options">期权</button>
        <button onclick="switchMode('bot')" id="mode-bot-btn" class="text-gray-400 pb-1 whitespace-nowrap transition hover:text-white" data-i18n="mode-bot">量化机器人</button>
    </div>

    <!-- 实时价格横幅 -->
    <div class="px-4 py-2.5 bg-okxCard/70 border-b border-gray-800 flex justify-between items-center text-xs backdrop-blur-sm">
        <span class="text-gray-400 font-medium" data-i18n="live-price-label">最新成交价</span>
        <div class="flex items-center space-x-2">
            <span class="text-okxGreen font-mono font-bold text-lg" id="live-price">0.00</span>
            <span class="text-xs text-gray-400" id="currency-unit-label">USDT</span>
        </div>
    </div>

    <!-- K线图容器 -->
    <div class="px-3 pt-2.5">
        <div class="bg-okxCard rounded-xl p-3 border border-gray-800 shadow-sm">
            <div class="text-[11px] text-gray-400 mb-1.5 flex justify-between items-center">
                <span id="chart-title-text" class="font-semibold text-gray-300">1分钟K线</span>
                <span class="text-okxGreen flex items-center bg-okxGreen/10 px-2 py-0.5 rounded-full"><span class="w-2 h-2 rounded-full bg-okxGreen inline-block mr-1.5 animate-pulse"></span> <span data-i18n="chart-status">运行流畅</span></span>
            </div>
            <div id="chart-container" style="width: 100%; height: 180px; position: relative;"></div>
        </div>
    </div>

    <!-- 动态交易面板区 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3" id="trading-panel-area"></div>

    <!-- 订单与持仓列表 -->
    <div class="px-3 pt-1">
        <div class="bg-okxCard rounded-xl p-3.5 border border-gray-800 shadow-sm">
            <div class="flex border-b border-gray-800 pb-2 mb-2 text-xs font-bold items-center justify-between">
                <span class="text-white border-b-2 border-okxGreen pb-1" data-i18n="orders-title">当前持仓与历史订单</span>
                <span class="text-[10px] text-gray-400 font-normal" data-i18n="orders-tip">实时盈亏追踪</span>
            </div>
            <div id="orders-list" class="space-y-2.5 max-h-48 overflow-y-auto text-xs pr-1">
                <div class="text-gray-500 text-center py-6" data-i18n="orders-empty">暂无交易订单，快去上方尝试下单吧！</div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 bg-okxCard border-t border-gray-800 flex justify-around items-center pb-[env(safe-area-inset-bottom)] z-50 shadow-lg">
        <a href="./market.html" class="flex-1 h-full text-gray-400 text-xs flex flex-col items-center justify-center font-bold hover:text-white transition" data-i18n="nav-market">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
            行情
        </a>
        <a href="./trade.html?symbol=BTC" class="flex-1 h-full text-okxGreen text-xs flex flex-col items-center justify-center font-bold transition group" id="nav-trade-link">
            <div class="w-7 h-7 rounded-full bg-okxGreen/15 flex items-center justify-center mb-0.5 group-hover:scale-110 transition">
                <svg class="w-4 h-4 text-okxGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                </svg>
            </div>
            <span data-i18n="nav-trade">交易</span>
        </a>
        <a href="./assets.html" class="flex-1 h-full text-gray-400 text-xs flex flex-col items-center justify-center font-bold hover:text-white transition" data-i18n="nav-assets">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            资产
        </a>
    </nav>

    <script>
        const basePrices = {
            'BTC': 83350.00, 'ETH': 3120.50, 'SOL': 185.20, 'XRP': 0.6250, 'DOGE': 0.1680,
            'ADA': 0.4520, 'TRX': 0.1240, 'AVAX': 32.50, 'LINK': 14.80, 'SUI': 1.95,
            'SHIB': 0.000022, 'BCH': 380.00, 'DOT': 7.20, 'NEAR': 5.60, 'LTC': 82.40,
            'UNI': 8.90, 'APT': 9.50, 'PEPE': 0.000012, 'ICP': 9.20, 'RENDER': 7.80
        };

        const urlParams = new URLSearchParams(window.location.search);
        let currentSymbol = (urlParams.get('symbol') || 'BTC').toUpperCase();
        if (!basePrices[currentSymbol]) currentSymbol = 'BTC';

        const symbolSelect = document.getElementById('symbol-select');
        Object.keys(basePrices).forEach(sym => {
            const opt = document.createElement('option');
            opt.value = sym;
            opt.innerText = `${sym}/USDT`;
            if (sym === currentSymbol) opt.selected = true;
            symbolSelect.appendChild(opt);
        });

        function switchSymbol(newSym) {
            window.location.href = `./trade.html?symbol=${newSym}`;
        }

        let currentCoinPrice = basePrices[currentSymbol] || 100.00;
        let currentTradeMode = 'spot'; 
        let spotOrderType = 'limit'; 
        let selectedLeverage = 20;   
        let selectedOptionType = 'CALL'; 

        document.getElementById('chart-title-text').innerText = `${currentSymbol}/USDT 1-Min Chart`;
        document.getElementById('nav-trade-link').href = `./trade.html?symbol=${currentSymbol}`;

        const i18nData = {
            'zh-CN': {
                'tag-sim': 'Pro', 'live-price-label': '最新成交价', 'chart-status': '运行流畅',
                'mode-spot': '现货', 'mode-futures': '永续合约', 'mode-options': '期权', 'mode-bot': '量化机器人',
                'orders-title': '当前持仓与历史订单', 'orders-tip': '实时盈亏追踪', 'orders-empty': '暂无交易订单，快去上方尝试下单吧！',
                'nav-market': '行情', 'nav-trade': '交易', 'nav-assets': '资产', 'timeZone': 'Asia/Shanghai',
                'btn-limit': '限价单', 'btn-market': '市价单', 'label-price': '委托价格', 'label-amount': '数量',
                'btn-spot-buy': '现货买入', 'label-lev': '合约杠杆倍数', 'label-mark': '标记价格', 'label-margin': '保证金模式',
                'label-margin-cross': '全仓 (Cross)', 'btn-long': '做多 (Long)', 'btn-short': '做空 (Short)',
                'opt-call': '看涨 (CALL)', 'opt-put': '看跌 (PUT)', 'label-strike': '行权价', 'label-premium': '权利金本金',
                'btn-opt': '申购期权', 'bot-title': 'AI 网格策略', 'label-range': '价格区间', 'label-grid': '网格数量',
                'label-fund': '投入本金', 'btn-bot': '启动机器人', 'btn-close': '平仓', 'msg-no-amount': '请输入有效数量！',
                'msg-no-usdt': 'USDT 余额不足！', 'msg-spot-success': '🎉 现货买入成功！', 'msg-lev-success': '🎉 合约开仓成功！',
                'msg-opt-success': '🎉 期权申购成功！', 'msg-bot-success': '🤖 量化网格机器人已启动！', 'msg-close-success': '✅ 平仓成功，资金已入账！'
            },
            'en-US': {
                'tag-sim': 'Pro', 'live-price-label': 'Latest Price', 'chart-status': 'Running Smooth',
                'mode-spot': 'Spot', 'mode-futures': 'Futures', 'mode-options': 'Options', 'mode-bot': 'Trading Bot',
                'orders-title': 'Positions & Orders', 'orders-tip': 'Real-time PnL Tracking', 'orders-empty': 'No active orders, start trading above!',
                'nav-market': 'Market', 'nav-trade': 'Trade', 'nav-assets': 'Assets', 'timeZone': 'America/New_York',
                'btn-limit': 'Limit', 'btn-market': 'Market', 'label-price': 'Order Price', 'label-amount': 'Amount',
                'btn-spot-buy': 'Spot Buy', 'label-lev': 'Leverage', 'label-mark': 'Mark Price', 'label-margin': 'Margin Mode',
                'label-margin-cross': 'Cross', 'btn-long': 'Long', 'btn-short': 'Short',
                'opt-call': 'CALL', 'opt-put': 'PUT', 'label-strike': 'Strike Price', 'label-premium': 'Premium (USDT)',
                'btn-opt': 'Subscribe Option', 'bot-title': 'AI Grid Strategy', 'label-range': 'Price Range', 'label-grid': 'Grids',
                'label-fund': 'Investment', 'btn-bot': 'Start Bot', 'btn-close': 'Close', 'msg-no-amount': 'Please enter a valid amount!',
                'msg-no-usdt': 'Insufficient USDT balance!', 'msg-spot-success': '🎉 Spot buy successful!', 'msg-lev-success': '🎉 Futures order placed!',
                'msg-opt-success': '🎉 Option subscribed!', 'msg-bot-success': '🤖 Grid bot started!', 'msg-close-success': '✅ Position closed successfully!'
            },
            'zh-HK': {
                'tag-sim': 'Pro', 'live-price-label': '最新成交價', 'chart-status': '運行流暢',
                'mode-spot': '現貨', 'mode-futures': '永續合約', 'mode-options': '期權', 'mode-bot': '量化機器人',
                'orders-title': '當前持倉與歷史訂單', 'orders-tip': '實時盈虧追踪', 'orders-empty': '暫無交易訂單，快去上方嘗試下單吧！',
                'nav-market': '行情', 'nav-trade': '交易', 'nav-assets': '資產', 'timeZone': 'Asia/Hong_Kong',
                'btn-limit': '限價單', 'btn-market': '市價單', 'label-price': '委託價格', 'label-amount': '數量',
                'btn-spot-buy': '現貨買入', 'label-lev': '合約杠桿倍數', 'label-mark': '標記價格', 'label-margin': '保證金模式',
                'label-margin-cross': '全倉 (Cross)', 'btn-long': '做多 (Long)', 'btn-short': '做空 (Short)',
                'opt-call': '看漲 (CALL)', 'opt-put': '看跌 (PUT)', 'label-strike': '行權價', 'label-premium': '權利金本金',
                'btn-opt': '申購期權', 'bot-title': 'AI 網格策略', 'label-range': '價格區間', 'label-grid': '網格數量',
                'label-fund': '投入本金', 'btn-bot': '啟動機器人', 'btn-close': '平倉', 'msg-no-amount': '請輸入有效數量！',
                'msg-no-usdt': 'USDT 餘額不足！', 'msg-spot-success': '🎉 現貨買入成功！', 'msg-lev-success': '🎉 合約開倉成功！',
                'msg-opt-success': '🎉 期權申購成功！', 'msg-bot-success': '🤖 量化網格機器人已啟動！', 'msg-close-success': '✅ 平倉成功，資金已入賬！'
            }
        };

        let currentLang = localStorage.getItem('exchange_lang') || 'zh-CN';
        let currentCurrency = localStorage.getItem('exchange_currency') || 'USDT';
        document.getElementById('lang-select').value = currentLang;
        document.getElementById('currency-select').value = currentCurrency;
        document.getElementById('currency-unit-label').innerText = currentCurrency;

        function t(key) {
            return (i18nData[currentLang] && i18nData[currentLang][key]) || i18nData['zh-CN'][key] || key;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('exchange_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[currentLang] && i18nData[currentLang][key]) {
                    el.innerText = i18nData[currentLang][key];
                }
            });
            document.getElementById('chart-title-text').innerText = `${currentSymbol}/USDT ${currentLang === 'en-US' ? '1-Min Chart' : '1分钟K线'}`;
            renderTradingPanel();
            renderOrders();
        }
        changeLanguage(currentLang);

        function changeValCurrency(curr) {
            currentCurrency = curr;
            localStorage.setItem('exchange_currency', curr);
            document.getElementById('currency-unit-label').innerText = curr;
        }

        function updateLocalizedTime() {
            try {
                const timeZone = (i18nData[currentLang] && i18nData[currentLang].timeZone) || 'Asia/Shanghai';
                const timeStr = new Intl.DateTimeFormat('en-GB', { timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
                const timeEl = document.getElementById('live-time');
                if (timeEl) timeEl.innerText = `${timeStr} (${currentLang.split('-')[1]})`;
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(updateLocalizedTime, 1000);
        updateLocalizedTime();

        function switchMode(mode) {
            currentTradeMode = mode;
            ['spot', 'futures', 'options', 'bot'].forEach(m => {
                const btn = document.getElementById(`mode-${m}-btn`);
                if (!btn) return;
                if (m === mode) {
                    btn.className = "text-okxGreen border-b-2 border-okxGreen pb-1 whitespace-nowrap font-bold transition";
                } else {
                    btn.className = "text-gray-400 pb-1 whitespace-nowrap font-normal transition hover:text-white";
                }
            });
            renderTradingPanel();
        }

        function renderTradingPanel() {
            const area = document.getElementById('trading-panel-area');
            if (!area) return;
            const pStr = currentCoinPrice < 1 ? currentCoinPrice.toFixed(6) : currentCoinPrice.toFixed(2);
            const offset = currentCoinPrice * 0.0002;
            const decimals = currentCoinPrice < 1 ? 6 : 2;

            if (currentTradeMode === 'spot') {
                area.innerHTML = `
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 text-xs shadow-sm">
                        <div class="flex justify-between mb-2.5 bg-gray-900 p-1 rounded">
                            <button onclick="setSpotType('limit')" class="flex-1 py-1 rounded font-medium transition ${spotOrderType==='limit'?'bg-gray-700 text-white shadow':'text-gray-400 hover:text-white'}">${t('btn-limit')}</button>
                            <button onclick="setSpotType('market')" class="flex-1 py-1 rounded font-medium transition ${spotOrderType==='market'?'bg-gray-700 text-white shadow':'text-gray-400 hover:text-white'}">${t('btn-market')}</button>
                        </div>
                        <div class="text-gray-400 mb-1 flex justify-between px-1 font-mono"><span>${t('label-price')} (${currentCurrency})</span><span>${t('label-amount')}</span></div>
                        <div class="space-y-1 text-okxRed font-mono text-[11px]">
                            <div class="flex justify-between px-1"><span>${(currentCoinPrice + offset*2).toFixed(decimals)}</span><span>0.51</span></div>
                            <div class="flex justify-between px-1"><span>${(currentCoinPrice + offset).toFixed(decimals)}</span><span>1.20</span></div>
                        </div>
                        <div class="text-center py-2.5 text-base font-bold text-okxGreen my-1.5 border-y border-gray-800 font-mono bg-gray-900/40 rounded">${pStr}</div>
                        <div class="space-y-1 text-okxGreen font-mono text-[11px]">
                            <div class="flex justify-between px-1"><span>${(currentCoinPrice - offset).toFixed(decimals)}</span><span>0.85</span></div>
                            <div class="flex justify-between px-1"><span>${(currentCoinPrice - offset*2).toFixed(decimals)}</span><span>2.10</span></div>
                        </div>
                    </div>
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 flex flex-col justify-between shadow-sm">
                        <div class="space-y-2.5">
                            ${spotOrderType === 'limit' ? `
                                <div>
                                    <label class="text-[11px] text-gray-400 block mb-1">${t('label-price')} (${currentCurrency})</label>
                                    <input type="text" id="spot-price-input" value="${pStr}" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-okxGreen">
                                </div>
                            ` : `
                                <div class="text-[11px] text-okxGreen bg-okxGreen/10 p-3 rounded-lg text-center font-medium">${currentLang === 'en-US' ? 'Execute immediately at best market price' : '以当前最优市场价格秒速成交'}</div>
                            `}
                            <div>
                                <label class="text-[11px] text-gray-400 block mb-1">${t('label-amount')} (${currentSymbol})</label>
                                <input type="text" id="spot-amount-input" placeholder="1.0" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-okxGreen">
                            </div>
                        </div>
                        <button onclick="executeSpotTrade()" class="w-full bg-okxGreen hover:bg-okxGreen/90 text-white py-2.5 rounded-lg text-xs font-bold mt-4 shadow transition active:scale-[0.98]">${t('btn-spot-buy')} ${currentSymbol}</button>
                    </div>
                `;
            } else if (currentTradeMode === 'futures') {
                area.innerHTML = `
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 text-xs shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-gray-400 font-medium">${t('label-lev')}</span>
                                <span class="text-okxGreen font-bold font-mono text-sm">${selectedLeverage}x</span>
                            </div>
                            <input type="range" min="1" max="125" value="${selectedLeverage}" oninput="setLev(this.value)" class="w-full accent-okxGreen mb-2 cursor-pointer">
                            <div class="flex justify-between text-[10px] text-gray-500 font-mono"><span>1x</span><span>50x</span><span>125x</span></div>
                        </div>
                        <div class="mt-3 p-2 bg-gray-900 rounded-lg border border-gray-800 text-[11px] space-y-1 font-mono">
                            <div class="flex justify-between text-gray-400"><span>${t('label-mark')}:</span><span class="text-white">${pStr}</span></div>
                            <div class="flex justify-between text-gray-400"><span>${t('label-margin')}:</span><span class="text-okxGreen">${t('label-margin-cross')}</span></div>
                        </div>
                    </div>
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 flex flex-col justify-between shadow-sm">
                        <div>
                            <label class="text-[11px] text-gray-400 block mb-1">${t('label-amount')} (${currentSymbol})</label>
                            <input type="text" id="futures-amount-input" placeholder="1.0" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-okxGreen">
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="executeFuturesTrade('LONG')" class="bg-okxGreen hover:bg-okxGreen/90 text-white py-2.5 rounded-lg text-xs font-bold shadow transition active:scale-[0.98]">${t('btn-long')}</button>
                            <button onclick="executeFuturesTrade('SHORT')" class="bg-okxRed hover:bg-okxRed/90 text-white py-2.5 rounded-lg text-xs font-bold shadow transition active:scale-[0.98]">${t('btn-short')}</button>
                        </div>
                    </div>
                `;
            } else if (currentTradeMode === 'options') {
                area.innerHTML = `
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 text-xs shadow-sm space-y-3">
                        <div class="flex space-x-2 bg-gray-900 p-1 rounded">
                            <button onclick="setOpt('CALL')" class="flex-1 py-1.5 rounded font-medium transition ${selectedOptionType==='CALL'?'bg-okxGreen text-white shadow':'text-gray-400 hover:text-white'}">${t('opt-call')}</button>
                            <button onclick="setOpt('PUT')" class="flex-1 py-1.5 rounded font-medium transition ${selectedOptionType==='PUT'?'bg-okxRed text-white shadow':'text-gray-400 hover:text-white'}">${t('opt-put')}</button>
                        </div>
                        <div class="text-[11px] text-gray-400 flex justify-between p-2 bg-gray-900 rounded-lg font-mono"><span>${t('label-strike')}:</span><span class="text-white font-bold">${(currentCoinPrice*1.05).toFixed(2)} USDT</span></div>
                    </div>
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 flex flex-col justify-between shadow-sm">
                        <div>
                            <label class="text-[11px] text-gray-400 block mb-1">${t('label-premium')}</label>
                            <input type="text" id="option-amount-input" placeholder="100" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-blue-500">
                        </div>
                        <button onclick="executeOptionTrade()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg text-xs font-bold mt-3 shadow transition active:scale-[0.98]">${t('btn-opt')}</button>
                    </div>
                `;
            } else if (currentTradeMode === 'bot') {
                const lowPrice = (currentCoinPrice * 0.8).toFixed(2);
                const highPrice = (currentCoinPrice * 1.2).toFixed(2);
                area.innerHTML = `
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 text-xs shadow-sm space-y-2">
                        <div class="font-bold text-white text-sm mb-1 flex items-center"><span class="w-2 h-2 bg-purple-500 rounded-full mr-2 animate-pulse"></span>${t('bot-title')} (${currentSymbol})</div>
                        <div class="flex justify-between text-gray-400 p-2 bg-gray-900 rounded-lg font-mono"><span>${t('label-range')}:</span><span class="text-white">${lowPrice} - ${highPrice}</span></div>
                        <div class="flex justify-between text-gray-400 p-2 bg-gray-900 rounded-lg font-mono"><span>${t('label-grid')}:</span><span class="text-white">20 Grids</span></div>
                    </div>
                    <div class="bg-okxCard p-3 rounded-xl border border-gray-800 flex flex-col justify-between shadow-sm">
                        <div>
                            <label class="text-[11px] text-gray-400 block mb-1">${t('label-fund')} (USDT)</label>
                            <input type="text" id="bot-amount-input" placeholder="1000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-purple-500">
                        </div>
                        <button onclick="executeBotTrade()" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-lg text-xs font-bold mt-3 shadow transition active:scale-[0.98]">${t('btn-bot')}</button>
                    </div>
                `;
            }
        }

        function setSpotType(t) { spotOrderType = t; renderTradingPanel(); }
        function setLev(l) { selectedLeverage = parseInt(l); renderTradingPanel(); }
        function setOpt(o) { selectedOptionType = o; renderTradingPanel(); }

        let chart, candlestickSeries, lastBar;

        window.onload = function() {
            const chartContainer = document.getElementById('chart-container');
            if (chartContainer) {
                chart = LightweightCharts.createChart(chartContainer, {
                    width: chartContainer.clientWidth || 350,
                    height: 180,
                    layout: { background: { type: 'solid', color: '#1e2631' }, textColor: '#9ca3af' },
                    grid: { vertLines: { color: '#2a3441' }, horzLines: { color: '#2a3441' } },
                    timeScale: { timeVisible: true, secondsVisible: true, borderColor: '#2a3441' },
                    rightPriceScale: { borderColor: '#2a3441' }
                });

                candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#00b07c', downColor: '#f14668', borderVisible: false,
                    wickUpColor: '#00b07c', wickDownColor: '#f14668',
                });

                let now = Math.floor(Date.now() / 1000) - 30 * 60;
                let initialData = [];
                let p = currentCoinPrice * 0.995;
                for (let i = 0; i < 30; i++) {
                    let open = p;
                    let close = open + (Math.random() - 0.49) * (currentCoinPrice * 0.002);
                    let high = Math.max(open, close) + Math.random() * (currentCoinPrice * 0.001);
                    let low = Math.min(open, close) - Math.random() * (currentCoinPrice * 0.001);
                    initialData.push({ time: now + i * 60, open, high, low, close });
                    p = close;
                }
                candlestickSeries.setData(initialData);
                chart.timeScale().fitContent();
                currentCoinPrice = p;
                lastBar = initialData[initialData.length - 1];
            }

            renderTradingPanel();
            setInterval(updateSmoothPrice, 1000);
            renderOrders();
        };

        function updateSmoothPrice() {
            if (!chart || !candlestickSeries) return;
            const step = currentCoinPrice * 0.0005;
            currentCoinPrice += (Math.random() - 0.49) * step;
            const priceStr = currentCoinPrice < 1 ? currentCoinPrice.toFixed(6) : currentCoinPrice.toFixed(2);

            const livePriceEl = document.getElementById('live-price');
            if (livePriceEl) livePriceEl.innerText = priceStr;
            const priceInput = document.getElementById('spot-price-input');
            if (priceInput && spotOrderType === 'limit') priceInput.value = priceStr;

            const currentMinute = Math.floor(Date.now() / 1000 / 60) * 60;
            if (lastBar && lastBar.time === currentMinute) {
                if (currentCoinPrice > lastBar.high) lastBar.high = currentCoinPrice;
                if (currentCoinPrice < lastBar.low) lastBar.low = currentCoinPrice;
                lastBar.close = currentCoinPrice;
            } else {
                lastBar = { time: currentMinute, open: currentCoinPrice, high: currentCoinPrice, low: currentCoinPrice, close: currentCoinPrice };
            }
            candlestickSeries.update(lastBar);
            updateOrdersPL();
        }

        function getOrders() {
            let allOrders = JSON.parse(localStorage.getItem('user_orders')) || {};
            return allOrders[currentSymbol] || [];
        }

        function saveOrders(orders) {
            let allOrders = JSON.parse(localStorage.getItem('user_orders')) || {};
            allOrders[currentSymbol] = orders;
            localStorage.setItem('user_orders', JSON.stringify(allOrders));
        }

        function logHistory(action, detail) {
            let logs = JSON.parse(localStorage.getItem('user_history_logs')) || [];
            logs.unshift({ action, detail, time: new Date().toLocaleString() });
            localStorage.setItem('user_history_logs', JSON.stringify(logs));
        }

        function renderOrders() {
            const orders = getOrders();
            const container = document.getElementById('orders-list');
            if (!container) return;

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center py-6" data-i18n="orders-empty">${t('orders-empty')}</div>`;
                return;
            }

            container.innerHTML = '';
            orders.slice().reverse().forEach((order, index) => {
                const actualIndex = orders.length - 1 - index;
                container.innerHTML += `
                    <div class="bg-gray-900/90 p-2.5 rounded-xl border border-gray-800 flex justify-between items-center transition hover:border-gray-700">
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-okxGreen font-bold">[${order.mode.toUpperCase()}] ${currentSymbol}</span>
                                <span class="text-[10px] text-gray-400 font-mono">${order.time}</span>
                            </div>
                            <div class="text-gray-400 mt-0.5 text-[11px] font-mono">${currentLang === 'en-US' ? 'Avg' : '均价'}: ${order.price.toFixed(order.price < 1 ? 6 : 2)} | ${currentLang === 'en-US' ? 'Amt' : '数量'}: ${order.amount}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold font-mono text-xs" id="pl-${actualIndex}">--</div>
                            <button onclick="closeOrder(${actualIndex})" class="mt-1 bg-red-500/20 hover:bg-red-500/30 text-okxRed px-2.5 py-0.5 rounded text-[10px] font-semibold transition">${t('btn-close')}</button>
                        </div>
                    </div>
                `;
            });
            updateOrdersPL();
        }

        function updateOrdersPL() {
            const orders = getOrders();
            orders.forEach((order, index) => {
                const plEl = document.getElementById(`pl-${index}`);
                if (plEl) {
                    let diff = 0;
                    if (order.mode === 'futures' && order.type === 'SHORT') {
                        diff = (order.price - currentCoinPrice) * order.amount * order.lev;
                    } else if (order.mode === 'futures') {
                        diff = (currentCoinPrice - order.price) * order.amount * order.lev;
                    } else if (order.mode === 'spot') {
                        diff = (currentCoinPrice - order.price) * order.amount;
                    } else {
                        diff = order.amount * 0.05 * (Math.random() + 0.2);
                    }
                    const percent = (diff / (order.price * order.amount)) * 100 * (order.lev || 1);
                    const sign = diff >= 0 ? '+' : '';
                    plEl.innerText = `${sign}${diff.toFixed(2)} (${sign}${percent.toFixed(1)}%)`;
                    plEl.className = diff >= 0 ? 'font-bold font-mono text-xs text-okxGreen' : 'font-bold font-mono text-xs text-okxRed';
                }
            });
        }

        function executeSpotTrade() {
            const price = spotOrderType === 'limit' ? parseFloat(document.getElementById('spot-price-input').value) : currentCoinPrice;
            const amount = parseFloat(document.getElementById('spot-amount-input').value);
            if (isNaN(amount) || amount <= 0) { showMsg(t('msg-no-amount')); return; }

            const cost = price * amount;
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            if (assets.usdt < cost) { showMsg(t('msg-no-usdt')); return; }

            assets.usdt -= cost;
            localStorage.setItem('user_assets', JSON.stringify(assets));

            let orders = getOrders();
            orders.push({ mode: 'spot', price, amount, time: new Date().toTimeString().substring(0, 8) });
            saveOrders(orders);
            logHistory(`Spot Buy (${currentSymbol})`, `Buy ${amount} @ ${price.toFixed(2)} USDT`);

            showMsg(t('msg-spot-success'));
            renderOrders();

            if (typeof triggerBackendTrade === 'function') triggerBackendTrade(`${currentSymbol}/USDT`, cost, 'BUY');
        }

        function executeFuturesTrade(type) {
            const amount = parseFloat(document.getElementById('futures-amount-input').value);
            if (isNaN(amount) || amount <= 0) { showMsg(t('msg-no-amount')); return; }

            const margin = (currentCoinPrice * amount) / selectedLeverage;
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            if (assets.usdt < margin) { showMsg(t('msg-no-usdt')); return; }

            assets.usdt -= margin;
            localStorage.setItem('user_assets', JSON.stringify(assets));

            let orders = getOrders();
            orders.push({ mode: 'futures', type, price: currentCoinPrice, amount, lev: selectedLeverage, time: new Date().toTimeString().substring(0, 8) });
            saveOrders(orders);
            logHistory(`Futures (${currentSymbol})`, `${type} ${selectedLeverage}x Amount:${amount}`);

            showMsg(t('msg-lev-success'));
            renderOrders();

            if (typeof triggerBackendTrade === 'function') triggerBackendTrade(`${currentSymbol}/USDT`, margin, type);
        }

        function executeOptionTrade() {
            const premium = parseFloat(document.getElementById('option-amount-input').value);
            if (isNaN(premium) || premium <= 0) { showMsg(t('msg-no-amount')); return; }

            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            if (assets.usdt < premium) { showMsg(t('msg-no-usdt')); return; }

            assets.usdt -= premium;
            localStorage.setItem('user_assets', JSON.stringify(assets));

            let orders = getOrders();
            orders.push({ mode: 'options', type: selectedOptionType, price: currentCoinPrice, amount: premium, time: new Date().toTimeString().substring(0, 8) });
            saveOrders(orders);
            logHistory(`Options (${currentSymbol})`, `${selectedOptionType} Premium:${premium} USDT`);

            showMsg(t('msg-opt-success'));
            renderOrders();

            if (typeof triggerBackendTrade === 'function') triggerBackendTrade(`${currentSymbol}/USDT`, premium, selectedOptionType);
        }

        function executeBotTrade() {
            const fund = parseFloat(document.getElementById('bot-amount-input').value);
            if (isNaN(fund) || fund <= 0) { showMsg(t('msg-no-amount')); return; }

            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            if (assets.usdt < fund) { showMsg(t('msg-no-usdt')); return; }

            assets.usdt -= fund;
            localStorage.setItem('user_assets', JSON.stringify(assets));

            let orders = getOrders();
            orders.push({ mode: 'bot', type: 'GRID', price: currentCoinPrice, amount: fund, time: new Date().toTimeString().substring(0, 8) });
            saveOrders(orders);
            logHistory(`Grid Bot (${currentSymbol})`, `Fund:${fund} USDT`);

            showMsg(t('msg-bot-success'));
            renderOrders();

            if (typeof triggerBackendTrade === 'function') triggerBackendTrade(`${currentSymbol}/USDT`, fund, 'GRID');
        }

        function closeOrder(index) {
            let orders = getOrders();
            let order = orders[index];
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };

            let returnUSDT = order.mode === 'spot' ? currentCoinPrice * order.amount : order.amount * 1.1;
            assets.usdt += returnUSDT;
            localStorage.setItem('user_assets', JSON.stringify(assets));

            logHistory(`Close Order (${currentSymbol})`, `Mode: ${order.mode.toUpperCase()}`);
            orders.splice(index, 1);
            saveOrders(orders);

            showMsg(t('msg-close-success'));
            renderOrders();
        }

        function showMsg(text) {
            const existing = document.getElementById('custom-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'custom-toast';
            toast.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-900 border border-gray-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl z-50 transition-all duration-300 flex items-center space-x-2';
            toast.innerHTML = `<span>${text}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        window.addEventListener('resize', () => { 
            const container = document.getElementById('chart-container');
            if (chart && container) chart.applyOptions({ width: container.clientWidth }); 
        });
    </script>
</body>
</html>
