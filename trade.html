<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web3 IDEX - 专业去中心化多模式交易终端</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        idexCyan: '#00f2fe',    /* 炫酷赛博青 */
                        idexPink: '#ff007a',    /* Web3 霓虹粉点缀 */
                        okxGreen: '#00b07c',    /* 涨绿色 */
                        okxRed: '#f14668',      /* 跌红色 */
                        okxDark: '#000000',   
                        okxCard: '#000000',   
                        okxBorder: '#121212', 
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000 !important;
            padding-bottom: calc(5rem + env(safe-area-inset-bottom));
        }
        .cyber-glow {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
            border: 1px solid rgba(0, 242, 254, 0.4);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #151515; border-radius: 2px; }
    </style>
</head>
<body class="bg-okxDark text-gray-200 font-sans selection:bg-idexCyan selection:text-black">

    <!-- 顶栏：仅保留右侧钱包连接与语言切换 -->
    <header class="flex justify-end items-center p-3 bg-okxDark border-b border-okxBorder sticky top-0 z-50 backdrop-blur-md bg-opacity-90 space-x-1.5">
        <button onclick="openUserCenter()" id="user-btn" class="text-[10px] bg-idexCyan/15 text-idexCyan border border-idexCyan/30 px-2.5 py-1 rounded-lg font-bold truncate max-w-[110px]">
            连接钱包
        </button>
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-black border border-[#181818] text-gray-200 text-xs rounded px-1.5 py-1 focus:outline-none focus:border-idexCyan">
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
            <option value="zh-HK">繁體中文</option>
        </select>
    </header>

    <!-- 顶层：四大交易模式切换栏 -->
    <div class="bg-black border-b border-okxBorder px-3 py-2 flex space-x-3 text-xs font-bold overflow-x-auto">
        <button onclick="switchMode('spot')" id="mode-spot" class="text-idexCyan border-b-2 border-idexCyan pb-1 whitespace-nowrap transition" data-i18n="mode-spot">现货交易 (Spot)</button>
        <button onclick="switchMode('futures')" id="mode-futures" class="text-gray-400 pb-1 whitespace-nowrap transition hover:text-white" data-i18n="mode-futures">合约交易 (Futures)</button>
        <button onclick="switchMode('options')" id="mode-options" class="text-gray-400 pb-1 whitespace-nowrap transition hover:text-white" data-i18n="mode-options">期权交易 (Options)</button>
        <button onclick="switchMode('quant')" id="mode-quant" class="text-gray-400 pb-1 whitespace-nowrap transition hover:text-white" data-i18n="mode-quant">量化机器人 (Bot)</button>
    </div>

    <!-- 第二层：币种选择栏 -->
    <div class="bg-black px-3 py-2 border-b border-okxBorder flex items-center space-x-2">
        <span class="text-[10px] text-gray-400 font-mono">Select Pair:</span>
        <select id="symbol-select" onchange="changeTradingPair(this.value)" class="bg-black border border-idexCyan/30 text-idexCyan text-xs rounded px-2.5 py-1 font-bold focus:outline-none">
        </select>
    </div>

    <!-- 交易页核心面板区 -->
    <div class="p-3 space-y-3">
        <!-- 实时行情总览条 -->
        <div class="bg-black p-3.5 rounded-xl border border-idexCyan/20 flex justify-between items-center cyber-glow">
            <div>
                <div class="text-[10px] text-gray-500 font-mono uppercase tracking-wider" id="live-pair-tag">BTC / USDT Market</div>
                <div class="text-2xl font-extrabold text-white font-mono mt-0.5" id="live-price">$0.00</div>
            </div>
            <div class="text-right font-mono">
                <div class="text-xs text-gray-400" id="live-vol">24h Vol: 3.82B</div>
                <div class="text-xs font-bold text-idexCyan mt-0.5" id="live-change">+2.45%</div>
            </div>
        </div>

        <!-- 烛线图与周期切换 -->
        <div class="bg-black rounded-xl border border-gray-900 overflow-hidden relative flex flex-col p-2">
            <div class="flex justify-between items-center px-2 py-1.5 border-b border-gray-900 text-[10px] font-mono text-gray-400">
                <span class="text-idexCyan font-bold" id="kline-title">BTC/USDT</span>
                <div class="flex space-x-1.5 overflow-x-auto">
                    <button onclick="changeInterval('1m')" id="int-1m" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-1m">1分</button>
                    <button onclick="changeInterval('5m')" id="int-5m" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-5m">5分</button>
                    <button onclick="changeInterval('15m')" id="int-15m" class="px-1.5 py-0.5 rounded bg-gray-800 text-idexCyan font-bold transition" data-i18n="time-15m">15分</button>
                    <button onclick="changeInterval('30m')" id="int-30m" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-30m">30分</button>
                    <button onclick="changeInterval('1h')" id="int-1h" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-60m">60分</button>
                    <button onclick="changeInterval('1D')" id="int-1D" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-day">日线</button>
                    <button onclick="changeInterval('1W')" id="int-1W" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-week">周线</button>
                    <button onclick="changeInterval('1M')" id="int-1M" class="px-1.5 py-0.5 rounded hover:bg-gray-800 transition" data-i18n="time-month">月线</button>
                </div>
            </div>
            <div id="tradingview-chart" class="w-full h-72 mt-1"></div>
        </div>

        <!-- 动态表单交互区 -->
        <div id="trade-action-panel" class="bg-black p-3.5 rounded-xl border border-gray-900 space-y-3">
        </div>

        <!-- OKX 风格专业底栏：【当前委托】与【当前仓位】双 Tab -->
        <div class="bg-black p-3.5 rounded-xl border border-gray-900 space-y-3">
            <div class="flex border-b border-gray-900 space-x-4 text-xs font-bold pb-2">
                <button onclick="switchBottomTab('orders')" id="tab-orders-btn" class="text-idexCyan border-b-2 border-idexCyan pb-1 transition" data-i18n="tab-orders">当前委托 (Open Orders)</button>

            </div>
            <div id="bottom-tab-content" class="space-y-2">
            </div>
        </div>
    </div>

        allCoins.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.innerText = `${s} / USDT`;
            if (s === currentSymbol) opt.selected = true;
            symbolSelect.appendChild(opt);
        });

        function changeTradingPair(sym) {
            window.location.href = `./trade.html?symbol=${sym}&lang=${currentLang}`;
        }

        let currentPrice = currentSymbol === 'ETH' ? 3120 : (currentSymbol === 'SOL' ? 185 : 83350);

        document.getElementById('live-pair-tag').innerText = `${currentSymbol} / USDT Market`;

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('exchange_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[currentLang] && i18nData[currentLang][key]) {
                    el.innerText = i18nData[currentLang][key];
                }
            });

            const user = getCurrentUser();
            const btn = document.getElementById('user-btn');
            if (btn && !user) {
                btn.innerText = i18nData[currentLang]['btn-not-login'];
            }

            renderActionPanel();
            renderBottomTabContent();
        }

        let chart, candlestickSeries;
        function initChart() {
            const container = document.getElementById('tradingview-chart');
            container.innerHTML = '';
            
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 270,
                layout: {
                    background: { type: 'solid', color: '#000000' },
                    textColor: '#888888',
                },
                grid: {
                    vertLines: { color: '#111111' },
                    horzLines: { color: '#111111' },
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#222222', timeVisible: true },
                rightPriceScale: { borderColor: '#222222' },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#00b07c',
                downColor: '#f14668',
                borderVisible: false,
                wickUpColor: '#00b07c',
                wickDownColor: '#f14668',
            });

            let data = generateMockCandles(currentPrice, 80);
            candlestickSeries.setData(data);
        }

        function generateMockCandles(baseP, count) {
            let arr = [];
            let time = Math.floor(Date.now() / 1000) - count * 900;
            let p = baseP * 0.95;
            for (let i = 0; i < count; i++) {
                let change = (Math.random() - 0.48) * (baseP * 0.015);
                let open = p;
                let close = open + change;
                let high = Math.max(open, close) + Math.random() * (baseP * 0.008);
                let low = Math.min(open, close) - Math.random() * (baseP * 0.008);
                arr.push({ time: time, open: parseFloat(open.toFixed(2)), high: parseFloat(high.toFixed(2)), low: parseFloat(low.toFixed(2)), close: parseFloat(close.toFixed(2)) });
                p = close;
                time += 900;
            }
            return arr;
        }

        function changeInterval(interval) {
            currentInterval = interval;
            ['1m', '5m', '15m', '30m', '1h', '1D', '1W', '1M'].forEach(i => {

                if(i === interval) {
                    btn.className = "px-1.5 py-0.5 rounded bg-gray-800 text-idexCyan font-bold transition";
                } else {
                    btn.className = "px-1.5 py-0.5 rounded hover:bg-gray-800 transition";

            candlestickSeries.setData(data);

        function cancelOrder(mode, index) {
            modeOrders[mode].splice(index, 1);
            renderBottomTabContent();
            alert('✓ 委托已成功撤销！');
        }

        function closePosition(mode, index) {
            modePositions[mode].splice(index, 1);
            renderBottomTabContent();
            alert('✓ 平仓操作成功！');
        }

        function useCurrentPrice() {
            const priceInput = document.getElementById('order-price');
            if(priceInput) priceInput.value = currentPrice;
        }

        function executeOrder() {
            const dict = i18nData[currentLang];
            if (currentMode === 'options' && userTotalAssetValue < 2000) {
                alert(dict['options-audit-fail']);
                return;
            }
            const amtElem = document.getElementById('order-amount');
            const amt = amtElem ? amtElem.value : '100';
            if(!amt) { alert('请输入有效数量或金额！'); return; }

            modeOrders[currentMode].push({
                id: Date.now(),
                symbol: currentSymbol,
                type: currentMode.toUpperCase() + ' LIMIT',
                price: currentPrice,
                amount: parseFloat(amt) / 1000
            });

            renderBottomTabContent();
            alert(`${dict['success-order']}\nMode: ${currentMode.toUpperCase()}\nPair: ${currentSymbol}/USDT\nAmount: ${amt}`);
        }

        function getCurrentUser() { return localStorage.getItem('exchange_current_user') || null; }
        function updateLoginButtonDisplay() {
            const user = getCurrentUser();
            const btn = document.getElementById('user-btn');
            const dict = i18nData[currentLang];
            if(btn) {
                if(user) {
                    btn.innerText = user;
                    btn.className = "text-[10px] bg-idexCyan/20 text-idexCyan border border-idexCyan/40 px-2.5 py-1 rounded-lg font-bold truncate max-w-[110px]";
                } else {
                    btn.innerText = dict['btn-not-login'];
                    btn.className = "text-[10px] bg-idexCyan/15 text-idexCyan border border-idexCyan/30 px-2.5 py-1 rounded-lg font-bold truncate max-w-[110px]";
                }
            }
        }

        function openUserCenter() {
            const user = getCurrentUser();
            if(!user) {
                window.location.href = './market.html';
            } else {
                alert(`Wallet Connected: ${user}`);
            }
        }

        window.onload = function() {
            changeLanguage(currentLang);
            updateLoginButtonDisplay();
            initChart();
            renderActionPanel();
            renderBottomTabContent();
        };
    </script>
