<!DOCTYPE html>
<html lang="zh-CN">
       <style>
    /* 强制重置与放大移动端底部导航栏 */
    nav.fixed.bottom-0 {
        height: 3.8rem !important; /* 增加导航栏整体高度 */
        padding-bottom: env(safe-area-inset-bottom) !important; /* 适配 iPhone 底部黑条，防止贴底 */
        display: flex !important;
        align-items: center !important;
        justify-content: space-around !important;
    }

    /* 放大导航栏内部的按钮和文字 */
    nav.fixed.bottom-0 a {
        flex: 1 !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        font-size: 0.85rem !important; /* 放大文字 */
        font-weight: 600 !important;
    }

    /* 增加页面底部留白，防止加高后的导航遮挡内容 */
    body {
        padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)) !important;
    }
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>模拟交易所 - 资产与交易历史</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        okxGreen: '#00b07c',
                        okxRed: '#f14668',
                        okxDark: '#12181f',
                        okxCard: '#1e2631',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-okxDark text-gray-200 font-sans pb-24">

    <!-- 顶栏 -->
    <header class="flex justify-between items-center p-3 bg-okxCard border-b border-gray-800 sticky top-0 z-50">
        <span class="text-base font-bold text-white" data-i18n="assets-title">资产总览</span>
        <div class="flex items-center space-x-1.5">
            <select id="currency-select" onchange="changeValCurrency(this.value)" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded px-1.5 py-1 focus:outline-none">
                <option value="USDT">USDT</option>
                <option value="USD">USD ($)</option>
                <option value="CNY">CNY (¥)</option>
                <option value="HKD">HKD (HK$)</option>
                <option value="BTC">BTC (₿)</option>
            </select>
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded px-1.5 py-1 focus:outline-none">
                <option value="zh-CN">简体中文</option>
                <option value="en-US">English</option>
                <option value="zh-HK">繁體中文</option>
            </select>
        </div>
    </header>

    <!-- 资产总估值与操作按钮 -->
    <div class="p-3">
        <div class="bg-gradient-to-r from-okxCard to-gray-800 p-4 rounded-xl border border-gray-800 shadow-lg">
            <div class="text-xs text-gray-400" data-i18n="total-equity">账户总资产折合</div>
            <div class="text-2xl font-extrabold text-white mt-1" id="total-val">--</div>
            
            <div class="grid grid-cols-3 gap-2 mt-4">
                <button onclick="openModal('deposit')" class="bg-okxGreen text-white py-2 rounded text-xs font-bold shadow flex items-center justify-center space-x-1">
                    <span>↓</span> <span data-i18n="btn-deposit">充币</span>
                </button>
                <button onclick="openModal('withdraw')" class="bg-gray-700 hover:bg-gray-600 text-white py-2 rounded text-xs font-bold shadow flex items-center justify-center space-x-1">
                    <span>↑</span> <span data-i18n="btn-withdraw">提币</span>
                </button>
                <button onclick="openModal('transfer')" class="bg-gray-700 hover:bg-gray-600 text-white py-2 rounded text-xs font-bold shadow flex items-center justify-center space-x-1">
                    <span>⇄</span> <span data-i18n="btn-transfer">划转</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 币种持仓列表 -->
    <div class="px-3">
        <div class="text-xs text-gray-400 mb-2 flex justify-between px-1">
            <span data-i18n="crypto-list">多币种资产持仓</span>
            <span data-i18n="crypto-value">估值</span>
        </div>
        <div class="bg-okxCard rounded-lg border border-gray-800 divide-y divide-gray-800 text-xs" id="asset-coins-list"></div>
    </div>

    <!-- 交易历史日志面板（跟随用户记录同步） -->
    <div class="px-3 pt-4">
        <div class="text-xs text-gray-400 mb-2 px-1 font-bold" data-i18n="history-title">全局交易与流水日志</div>
        <div class="bg-okxCard rounded-lg border border-gray-800 p-3 space-y-2 max-h-48 overflow-y-auto text-xs" id="history-logs-container">
            <div class="text-gray-500 text-center py-2" data-i18n="history-empty">暂无操作日志记录</div>
        </div>
    </div>

    <!-- 全局弹窗 -->
    <div id="action-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-okxCard w-full max-w-sm rounded-xl border border-gray-700 p-4 text-xs space-y-3 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-base font-bold">&times;</button>
            <div id="modal-title" class="text-sm font-bold text-white border-b border-gray-800 pb-2"></div>
            <div id="modal-body" class="space-y-3"></div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-okxCard border-t border-gray-800 flex justify-around py-2 z-50">
        <a href="./market.html" class="text-gray-400 text-xs flex flex-col items-center" data-i18n="nav-market">行情</a>
        <a href="./trade.html?symbol=BTC" class="text-gray-400 text-xs flex flex-col items-center" data-i18n="nav-trade">交易</a>
        <a href="./assets.html" class="text-okxGreen text-xs flex flex-col items-center font-bold" data-i18n="nav-assets">资产</a>
    </nav>

    <script>
        const i18nData = {
            'zh-CN': {
                'assets-title': '资产总览', 'total-equity': '账户总资产折合',
                'btn-deposit': '充币', 'btn-withdraw': '提币', 'btn-transfer': '划转',
                'crypto-list': '多币种资产持仓', 'crypto-value': '折合估值',
                'history-title': '全局交易与流水日志', 'history-empty': '暂无操作日志记录',
                'nav-market': '行情', 'nav-trade': '交易', 'nav-assets': '资产', 'timeZone': 'Asia/Shanghai',
                'title-deposit': 'TRC20 链上充币', 'title-withdraw': '数字资产提现', 'title-transfer': '资金划转',
                'lbl-network': '充币网络', 'lbl-amount': '数量', 'lbl-address': '充币地址',
                'btn-copy': '复制地址', 'copy-success': '地址已复制！',
                'btn-confirm-dep': '模拟充值 (+$10,000)', 'btn-confirm-wit': '确认提币', 'btn-confirm-tra': '确认划转',
                'alert-dep': '🎉 充值成功！', 'alert-wit': '✅ 提币申请已提交！', 'alert-tra': '⇄ 划转成功！'
            },
            'en-US': {
                'assets-title': 'Overview', 'total-equity': 'Total Account Equity',
                'btn-deposit': 'Deposit', 'btn-withdraw': 'Withdraw', 'btn-transfer': 'Transfer',
                'crypto-list': 'Crypto Holdings', 'crypto-value': 'Estimated Value',
                'history-title': 'Transaction History & Logs', 'history-empty': 'No activity logs',
                'nav-market': 'Market', 'nav-trade': 'Trade', 'nav-assets': 'Assets', 'timeZone': 'America/New_York',
                'title-deposit': 'On-chain Deposit', 'title-withdraw': 'Withdrawal', 'title-transfer': 'Transfer',
                'lbl-network': 'Network', 'lbl-amount': 'Amount', 'lbl-address': 'Address',
                'btn-copy': 'Copy', 'copy-success': 'Address copied!',
                'btn-confirm-dep': 'Simulate Deposit (+$10,000)', 'btn-confirm-wit': 'Confirm Withdraw', 'btn-confirm-tra': 'Confirm Transfer',
                'alert-dep': '🎉 Deposit successful!', 'alert-wit': '✅ Withdrawal submitted!', 'alert-tra': '⇄ Transfer successful!'
            },
            'zh-HK': {
                'assets-title': '資產總覽', 'total-equity': '賬戶總資產折合',
                'btn-deposit': '充幣', 'btn-withdraw': '提幣', 'btn-transfer': '劃轉',
                'crypto-list': '多幣種資產持倉', 'crypto-value': '折合估值',
                'history-title': '全局交易與流水日志', 'history-empty': '暫無操作日志記錄',
                'nav-market': '行情', 'nav-trade': '交易', 'nav-assets': '資產', 'timeZone': 'Asia/Hong_Kong',
                'title-deposit': 'TRC20 鏈上充幣', 'title-withdraw': '數字資產提現', 'title-transfer': '資金劃轉',
                'lbl-network': '充幣網絡', 'lbl-amount': '數量', 'lbl-address': '充幣地址',
                'btn-copy': '複製地址', 'copy-success': '地址已複製！',
                'btn-confirm-dep': '模擬充值 (+$10,000)', 'btn-confirm-wit': '確認提幣', 'btn-confirm-tra': '確認劃轉',
                'alert-dep': '🎉 充值成功！', 'alert-wit': '✅ 提幣申請已提交！', 'alert-tra': '⇄ 劃轉成功！'
            }
        };

        const topCoins = [
            { symbol: 'USDT', name: '泰达币', price: 1.00, icon: 'U', color: 'bg-blue-500/20 text-blue-400' },
            { symbol: 'BTC', name: '比特币', price: 83350.00, icon: '₿', color: 'bg-yellow-500/20 text-yellow-400' },
            { symbol: 'ETH', name: '以太坊', price: 3120.50, icon: 'Ξ', color: 'bg-indigo-500/20 text-indigo-400' },
            { symbol: 'SOL', name: 'Solana', price: 185.20, icon: 'S', color: 'bg-purple-500/20 text-purple-400' },
            { symbol: 'XRP', name: 'Ripple', price: 0.6250, icon: 'X', color: 'bg-gray-500/20 text-gray-300' },
            { symbol: 'DOGE', name: '狗狗币', price: 0.1680, icon: 'Ð', color: 'bg-amber-500/20 text-amber-400' },
            { symbol: 'ADA', name: 'Cardano', price: 0.4520, icon: 'A', color: 'bg-cyan-500/20 text-cyan-400' },
            { symbol: 'TRX', name: '波场', price: 0.1240, icon: 'T', color: 'bg-red-500/20 text-red-400' },
            { symbol: 'AVAX', name: '雪崩协议', price: 32.50, icon: 'AV', color: 'bg-rose-500/20 text-rose-400' },
            { symbol: 'LINK', name: 'Chainlink', price: 14.80, icon: 'L', color: 'bg-blue-600/20 text-blue-300' },
            { symbol: 'SUI', name: 'Sui', price: 1.95, icon: 'SU', color: 'bg-sky-500/20 text-sky-400' },
            { symbol: 'SHIB', name: '柴犬币', price: 0.000022, icon: 'SH', color: 'bg-orange-500/20 text-orange-400' },
            { symbol: 'BCH', name: '比特币现金', price: 380.00, icon: 'B+', color: 'bg-emerald-500/20 text-emerald-400' },
            { symbol: 'DOT', name: '波卡', price: 7.20, icon: 'D', color: 'bg-pink-500/20 text-pink-400' },
            { symbol: 'NEAR', name: 'NEAR Protocol', price: 5.60, icon: 'N', color: 'bg-zinc-500/20 text-zinc-300' },
            { symbol: 'LTC', name: '莱特币', price: 82.40, icon: 'Ł', color: 'bg-slate-500/20 text-slate-300' },
            { symbol: 'UNI', name: 'Uniswap', price: 8.90, icon: 'U+', color: 'bg-fuchsia-500/20 text-fuchsia-400' },
            { symbol: 'APT', name: 'Aptos', price: 9.50, icon: 'AP', color: 'bg-teal-500/20 text-teal-400' },
            { symbol: 'PEPE', name: '佩佩币', price: 0.000012, icon: 'P', color: 'bg-lime-500/20 text-lime-400' },
            { symbol: 'ICP', name: '互联网计算机', price: 9.20, icon: 'I', color: 'bg-violet-500/20 text-violet-400' },
            { symbol: 'RENDER', name: 'Render', price: 7.80, icon: 'R', color: 'bg-red-600/20 text-red-300' }
        ];

        let currentLang = localStorage.getItem('exchange_lang') || 'zh-CN';
        let currentCurrency = localStorage.getItem('exchange_currency') || 'USDT';
        document.getElementById('lang-select').value = currentLang;
        document.getElementById('currency-select').value = currentCurrency;

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('exchange_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[currentLang][key]) el.innerText = i18nData[currentLang][key];
            });
        }
        changeLanguage(currentLang);

        function changeValCurrency(curr) {
            currentCurrency = curr;
            localStorage.setItem('exchange_currency', curr);
            loadAssets();
        }

        const rates = { USDT: 1.0, USD: 1.0, CNY: 7.25, HKD: 7.82, BTC: 1 / 83350.0 };
        const symbols = { USDT: 'USDT', USD: '$', CNY: '¥', HKD: 'HK$', BTC: '₿' };

        function loadAssets() {
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            let totalValUSDT = assets.usdt || 0;

            const container = document.getElementById('asset-coins-list');
            if (!container) return;
            container.innerHTML = '';

            topCoins.forEach(coin => {
                let amount = coin.symbol === 'USDT' ? (assets.usdt || 0) : (assets[coin.symbol] || 0);
                let valUSDT = amount * coin.price;
                if (coin.symbol !== 'USDT') totalValUSDT += valUSDT;

                let convertedVal = valUSDT * (rates[currentCurrency] || 1.0);
                let sym = symbols[currentCurrency] || 'USDT';
                let valStr = currentCurrency === 'BTC' ? convertedVal.toFixed(4) : convertedVal.toFixed(2);

                container.innerHTML += `
                    <div class="p-3 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full ${coin.color} font-bold flex items-center justify-center text-xs">${coin.icon}</div>
                            <div>
                                <div class="font-bold text-white">${coin.symbol}</div>
                                <div class="text-[10px] text-gray-500">${coin.name}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-white">${coin.symbol === 'USDT' ? amount.toFixed(2) : amount.toFixed(4)}</div>
                            <div class="text-[10px] text-gray-500">≈ ${valStr} ${sym}</div>
                        </div>
                    </div>
                `;
            });

            let finalTotalConverted = totalValUSDT * (rates[currentCurrency] || 1.0);
            let finalSym = symbols[currentCurrency] || 'USDT';
            let finalTotalStr = currentCurrency === 'BTC' ? finalTotalConverted.toFixed(4) : finalTotalConverted.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('total-val').innerHTML = `${finalTotalStr} <span class="text-sm font-normal text-gray-400">${finalSym}</span>`;

            renderHistoryLogs();
        }

        function renderHistoryLogs() {
            let logs = JSON.parse(localStorage.getItem('user_history_logs')) || [];
            const container = document.getElementById('history-logs-container');
            if (!container) return;

            if (logs.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center py-2">${i18nData[currentLang]['history-empty']}</div>`;
                return;
            }

            container.innerHTML = '';
            logs.forEach(log => {
                container.innerHTML += `
                    <div class="bg-gray-900 p-2 rounded border border-gray-800 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-white">${log.action}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5">${log.detail}</div>
                        </div>
                        <div class="text-[10px] text-gray-500">${log.time}</div>
                    </div>
                `;
            });
        }

        function openModal(type) {
            const modal = document.getElementById('action-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const dict = i18nData[currentLang];
            modal.classList.remove('hidden');

            if (type === 'deposit') {
                titleEl.innerText = dict['title-deposit'];
                const trc20Addr = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${trc20Addr}`;
                bodyEl.innerHTML = `
                    <div><label class="text-gray-400 block mb-1">${dict['lbl-network']}</label>
                    <div class="bg-gray-900 border border-okxGreen text-okxGreen font-bold rounded p-1.5 text-center">TRON (TRC20)</div></div>
                    <div class="flex flex-col items-center justify-center py-2 bg-gray-900/50 rounded border border-gray-800">
                        <img src="${qrUrl}" class="w-28 h-28 bg-white p-1 rounded mb-2">
                        <span class="text-[10px] text-gray-400 text-center px-2 break-all" id="dep-addr">${trc20Addr}</span>
                    </div>
                    <button onclick="copyAddr()" class="w-full bg-gray-700 text-white py-1.5 rounded font-bold">${dict['btn-copy']}</button>
                    <button onclick="confirmDep()" class="w-full bg-okxGreen text-white py-2 rounded font-bold mt-1">${dict['btn-confirm-dep']}</button>
                `;
            } else if (type === 'withdraw') {
                titleEl.innerText = dict['title-withdraw'];
                bodyEl.innerHTML = `
                    <div><label class="text-gray-400 block mb-1">${dict['lbl-address']}</label>
                    <input type="text" placeholder="T..." class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white"></div>
                    <div><label class="text-gray-400 block mb-1">${dict['lbl-amount']} (USDT)</label>
                    <input type="text" id="wit-amt" placeholder="1000" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white"></div>
                    <button onclick="confirmWit()" class="w-full bg-red-600 text-white py-2 rounded font-bold mt-2">${dict['btn-confirm-wit']}</button>
                `;
            } else if (type === 'transfer') {
                titleEl.innerText = dict['title-transfer'];
                bodyEl.innerHTML = `
                    <div class="flex items-center space-x-2 bg-gray-900 p-2 rounded border border-gray-800"><span class="text-gray-400">从:</span><span class="text-white font-bold">资金账户</span></div>
                    <div class="text-center text-gray-500">↓</div>
                    <div class="flex items-center space-x-2 bg-gray-900 p-2 rounded border border-gray-800"><span class="text-gray-400">至:</span><span class="text-white font-bold">交易账户</span></div>
                    <div><label class="text-gray-400 block mb-1">数量 (USDT)</label>
                    <input type="text" id="tra-amt" placeholder="500" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white"></div>
                    <button onclick="confirmTra()" class="w-full bg-blue-600 text-white py-2 rounded font-bold mt-2">${dict['btn-confirm-tra']}</button>
                `;
            }
        }
        function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }
        function copyAddr() {
            navigator.clipboard.writeText(document.getElementById('dep-addr').innerText).then(() => alert(i18nData[currentLang]['copy-success']));
        }
        function confirmDep() {
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            assets.usdt += 10000.00;
            localStorage.setItem('user_assets', JSON.stringify(assets));
            logHistory('链上充币 (Deposit)', '+10,000 USDT (TRC20)');
            loadAssets();
            closeModal();
            alert(i18nData[currentLang]['alert-dep']);
        }
        function confirmWit() {
            let amt = parseFloat(document.getElementById('wit-amt').value);
            if (isNaN(amt) || amt <= 0) { alert('请输入有效金额！'); return; }
            let assets = JSON.parse(localStorage.getItem('user_assets')) || { usdt: 100000.00 };
            if (assets.usdt < amt) { alert('可用余额不足！'); return; }
            assets.usdt -= amt;
            localStorage.setItem('user_assets', JSON.stringify(assets));
            logHistory('提币提现 (Withdraw)', `-${amt} USDT`);
            loadAssets();
            closeModal();
            alert(i18nData[currentLang]['alert-wit']);
        }
        function confirmTra() {
            let amt = parseFloat(document.getElementById('tra-amt').value);
            if (isNaN(amt) || amt <= 0) { alert('请输入有效划转金额！'); return; }
            logHistory('内部划转 (Transfer)', `${amt} USDT (资金⇄交易)`);
            loadAssets();
            closeModal();
            alert(i18nData[currentLang]['alert-tra']);
        }
        function logHistory(action, detail) {
            let logs = JSON.parse(localStorage.getItem('user_history_logs')) || [];
            logs.unshift({ action, detail, time: new Date().toLocaleString() });
            localStorage.setItem('user_history_logs', JSON.stringify(logs));
        }

        window.onload = function() { loadAssets(); };
        setInterval(loadAssets, 1000);
    </script>
</body>
</html>
